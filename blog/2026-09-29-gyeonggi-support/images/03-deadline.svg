    <text x="1080" y="330" font-weight="800" fill="#c84d5b">오후 6시 마감</text>
  </g>
  <rect x="60" y="390" width="1080" height="84" rx="16" fill="#fff4e0"/>
  <text x="600" y="442" font-size="24" fill="#7a4b00" text-anchor="middle">마감 직전에는 접속이 몰릴 수 있어요 — 여유 있게 미리 신청하세요</text>
