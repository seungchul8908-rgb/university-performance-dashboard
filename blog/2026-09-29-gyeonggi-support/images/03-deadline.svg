  <line x1="120" y1="270" x2="1080" y2="270" stroke="#dfe6ef" stroke-width="10" stroke-linecap="round"/>
  <g font-size="22" text-anchor="middle">
    <circle cx="120" cy="270" r="22" fill="#16836a"/>
    <text x="120" y="215" font-weight="800" fill="#16836a">9/29(화)</text><text x="120" y="330" fill="#4a5b73">오늘</text>
    <circle cx="440" cy="270" r="16" fill="#fff" stroke="#16836a" stroke-width="6"/>
    <text x="440" y="215" font-weight="700" fill="#172e53">9/30(수)</text><text x="440" y="330" fill="#4a5b73">D-2</text>
    <circle cx="760" cy="270" r="16" fill="#fff" stroke="#9aa9bd" stroke-width="6"/>
    <text x="760" y="215" font-weight="700" fill="#172e53">10/1(목)</text><text x="760" y="330" fill="#4a5b73">D-1</text>
    <circle cx="1080" cy="270" r="26" fill="#c84d5b"/>
